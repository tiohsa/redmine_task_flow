name: Verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: npm ci --prefix frontend
      - name: Verify local checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA:verification/architecture-baseline.json"; then
            git show "$BASE_SHA:verification/architecture-baseline.json" > "$RUNNER_TEMP/architecture-baseline.json"
            export TASK_FLOW_BASELINE_REFERENCE="$RUNNER_TEMP/architecture-baseline.json"
          fi
          node verification/verify-cli.mjs --local
